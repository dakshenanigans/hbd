<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Kiv!</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- GSAP CDN for animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #fce4ec, #fff);
      color: #4a4a4a;
      overflow-x: hidden;
      position: relative;
    }
    .star {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #ffccff;
      clip-path: polygon(
        50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%
      );
      animation: sparkle 5s infinite;
      opacity: 1.0;
      z-index: 1;
    }
    @keyframes sparkle {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1.0;
        -webkit-transform: translateY(0) rotate(0deg);
      }
      50% {
        opacity: 0.6;
        transform: translateY(-80vh) rotate(180deg);
        -webkit-transform: translateY(-80vh) rotate(180deg);
      }
      100% {
        transform: translateY(-100vh) rotate(360deg);
        opacity: 0;
        -webkit-transform: translateY(-100vh) rotate(360deg);
      }
    }
    .butterfly {
      position: absolute;
      width: 22px;
      height: 22px;
      background: #ff99cc;
      clip-path: polygon(
        50% 20%, 70% 40%, 90% 20%, 70% 0%, 50% 20%, 30% 0%, 10% 20%, 30% 40%, 50% 20%, 50% 80%, 40% 100%, 60% 100%, 50% 80%
      );
      pointer-events: none;
      opacity: 0.9;
      animation: flutter 2s ease-out forwards;
      z-index: 1;
    }
    @keyframes flutter {
      0% {
        opacity: 0.9;
        transform: scale(0.5) rotate(0deg);
        -webkit-transform: scale(0.5) rotate(0deg);
      }
      50% {
        opacity: 0.6;
        transform: scale(1) rotate(45deg);
        -webkit-transform: scale(1) rotate(45deg);
      }
      100% {
        opacity: 0;
        transform: scale(0.8) rotate(90deg);
        -webkit-transform: scale(0.8) rotate(90deg);
      }
    }
    .sparkle {
      position: absolute;
      width: 15px;
      height: 15px;
      clip-path: polygon(
        50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%
      );
      opacity: 0.9;
      animation: glimmer 3s ease-out forwards;
      z-index: 1;
    }
    @keyframes glimmer {
      0% {
        opacity: 0.9;
        transform: translate(0, 0) scale(0.5);
        -webkit-transform: translate(0, 0) scale(0.5);
      }
      50% {
        opacity: 0.5;
        transform: translate(calc(20px - 40px * 0.5), calc(20px - 40px * 0.5)) scale(1);
        -webkit-transform: translate(calc(20px - 40px * 0.5), calc(20px - 40px * 0.5)) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(calc(40px - 80px * 0.5), calc(40px - 80px * 0.5)) scale(0.5);
        -webkit-transform: translate(calc(40px - 80px * 0.5), calc(40px - 80px * 0.5)) scale(0.5);
      }
    }
    .pink-spray {
      position: absolute;
      width: 20px;
      height: 7px;
      border-radius: 3px;
      opacity: 0.8;
      animation: spray 2.5s ease-out forwards;
      z-index: 1;
    }
    @keyframes spray {
      0% {
        opacity: 0.8;
        transform: scale(0.5) rotate(0deg);
        -webkit-transform: scale(0.5) rotate(0deg);
      }
      50% {
        opacity: 0.5;
        transform: scale(1) rotate(30deg) translate(calc(15px - 30px * 0.5), calc(15px - 30px * 0.5));
        -webkit-transform: scale(1) rotate(30deg) translate(calc(15px - 30px * 0.5), calc(15px - 30px * 0.5));
      }
      100% {
        opacity: 0;
        transform: scale(0.7) rotate(60deg) translate(calc(30px - 60px * 0.5), calc(30px - 60px * 0.5));
        -webkit-transform: scale(0.7) rotate(60deg) translate(calc(30px - 60px * 0.5), calc(30px - 60px * 0.5));
      }
    }
    .heart {
      position: absolute;
      width: 18px;
      height: 18px;
      background: #ff99cc;
      transform: rotate(-45deg);
      opacity: 0.9;
      animation: heartFloat 1.5s ease-out forwards;
      z-index: 1;
    }
    .heart::before,
    .heart::after {
      content: '';
      width: 18px;
      height: 18px;
      background: #ff99cc;
      border-radius: 50%;
      position: absolute;
    }
    .heart::before {
      top: -9px;
      left: 0;
    }
    .heart::after {
      left: 9px;
      top: 0;
    }
    @keyframes heartFloat {
      0% {
        opacity: 0.9;
        transform: translate(0, 0) rotate(-45deg) scale(0.5);
        -webkit-transform: translate(0, 0) rotate(-45deg) scale(0.5);
      }
      100% {
        opacity: 0;
        transform: translate(calc(50px - 100px * 0.5), calc(-50px)) rotate(-45deg) scale(1);
        -webkit-transform: translate(calc(50px - 100px * 0.5), calc(-50px)) rotate(-45deg) scale(1);
      }
    }
    .title {
      opacity: 1 !important; /* Fallback to ensure visibility */
      z-index: 100; /* Increased to ensure title is above all elements */
    }
    .photo {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      border: 2px solid #ffccff;
    }
    .photo:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6">
  <!-- Floating Stars Animation -->
  <div id="stars"></div>

  <!-- Title Section -->
  <h1 id="title" class="title text-6xl md:text-8xl text-pink-400 text-center mt-12 animate-bounce" style="opacity: 1; z-index: 100;">Happy Birthday Kiv!</h1>

  <!-- Description Section -->
  <p class="text-2xl md:text-3xl text-gray-600 text-center mt-10 max-w-2xl">
    The 18th is finally here!!! Many Many congrats to you, hope you enjoy this year like no other and have the perfect  start to your adult life. Have a blast. LY!
  </p>

  <!-- Photo Gallery -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-10 mt-12 max-w-5xl w-full">
    <img src="k1.jpg" class="photo rounded-lg w-full h-72 object-cover">
    <img src="k2.jpg" class="photo rounded-lg w-full h-72 object-cover">
    <img src="k3.jpg" class="photo rounded-lg w-full h-72 object-cover">
  </div>

  <!-- Footer -->
  <footer class="mt-12 text-gray-500 text-lg">
    Made with 💖 for Kiv's 18th Birthday
  </footer>

  <script>
    // Check if GSAP is loaded
    if (typeof gsap === 'undefined') {
      console.warn('GSAP library failed to load. Animations may not work.');
    }

    // GSAP Animations
    gsap.from("h1", {
      duration: 1,
      y: -50,
      opacity: 0,
      ease: "bounce",
      onComplete: function() {
        gsap.set("h1", { opacity: 1 }); // Ensure opacity is 1 after animation
      }
    });
    gsap.from("p", { duration: 1, y: 50, opacity: 0, delay: 0.5 });
    gsap.from(".photo", {
      duration: 1,
      y: 100,
      opacity: 0,
      stagger: 0.2,
      delay: 1.5
    });

    // Ensure title visibility after animation
    gsap.to("h1", { duration: 0, opacity: 1, delay: 1 });

    // Hearts with Title Bounce
    function createHearts() {
      const title = document.getElementById("title");
      const rect = title.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      for (let i = 0; i < 6; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.style.left = centerX + (Math.random() * 100 - 50) + "px";
        heart.style.top = centerY + (Math.random() * 50 - 25) + "px";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1500);
      }
    }
    // Call createHearts separately to avoid dependency on GSAP animation
    setTimeout(createHearts, 1000);

    // Floating Stars
    function createStar() {
      const star = document.createElement("div");
      star.className = "star";
      star.style.left = Math.random() * 100 + "vw";
      star.style.animationDuration = Math.random() * 2 + 3 + "s";
      document.getElementById("stars").appendChild(star);
      setTimeout(() => star.remove(), 5000);
    }
    setInterval(createStar, 400);

    // Butterfly Trail Following Mouse (throttled)
    let lastButterflyTime = 0;
    document.addEventListener("mousemove", (e) => {
      const now = Date.now();
      if (now - lastButterflyTime > 100) { // Throttle to every 100ms
        const butterfly = document.createElement("div");
        butterfly.className = "butterfly";
        butterfly.style.left = e.clientX + "px";
        butterfly.style.top = e.clientY + "px";
        document.body.appendChild(butterfly);
        setTimeout(() => butterfly.remove(), 2000);
        lastButterflyTime = now;
      }
    });

    // Random Sparkles (Golden and Silver)
    function createSparkle() {
      const sparkle = document.createElement("div");
      sparkle.className = "sparkle";
      sparkle.style.left = Math.random() * window.innerWidth + "px";
      sparkle.style.top = Math.random() * window.innerHeight + "px";
      sparkle.style.background = Math.random() > 0.5 ? '#ffd700' : '#c0c0c0';
      document.body.appendChild(sparkle);
      setTimeout(() => sparkle.remove(), 3000);
    }
    setInterval(createSparkle, 600);

    // Random Pink Spray Animations
    function createPinkSpray() {
      const colors = ['#ffc1cc', '#ff9999', '#ff69b4']; // Soft pink, blush pink, hot pink
      for (let i = 0; i < 3; i++) {
        const spray = document.createElement("div");
        spray.className = "pink-spray";
        spray.style.left = Math.random() * window.innerWidth + "px";
        spray.style.top = Math.random() * window.innerHeight + "px";
        spray.style.background = colors[Math.floor(Math.random() * colors.length)];
        spray.style.transform = `rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(spray);
        setTimeout(() => spray.remove(), 2500);
      }
    }
    setInterval(createPinkSpray, 1000);
  </script>
</body>
</html>
